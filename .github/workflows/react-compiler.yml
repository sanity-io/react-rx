name: Maintain React Compiler

on:
  schedule:
    - cron: "0 0 * * 1-5" # Runs at midnight UTC every weekday (Monday to Friday)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  run:
    name: Should React Compiler dependencies be updated? 🤔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: pnpm -r up --ignore-scripts react-compiler-runtime@latest babel-plugin-react-compiler@latest eslint-plugin-react-hooks@latest
      - uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - id: check-changes
        run: |
          if git diff --name-only | grep -q 'package.json'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        with:
          body: I ran `pnpm -r up --ignore-scripts react-compiler-runtime@latest babel-plugin-react-compiler@latest eslint-plugin-react-hooks@latest` 🧑‍💻
          branch: actions/react-compiler
          commit-message: "fix(deps): update react compiler dependencies 🤖 ✨"
          labels: 🤖 bot
          sign-commits: true
          title: "fix(deps): update React Compiler dependencies 🤖 ✨"
          token: ${{ steps.generate-token.outputs.token }}
