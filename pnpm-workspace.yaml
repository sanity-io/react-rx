packages:
  - 'packages/*'
  - 'website'
  - 'async-react'

catalog:
  rxjs: ^7.8.2

catalogMode: prefer

autoDedupe: true

allowBuilds:
  es5-ext: false
  esbuild: false
  msw: false
  sharp: true

minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@sanity/*'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - '@vitejs/plugin-react@6.1.0 || 6.1.1'
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  - '@types/node@24.19.2'
  - 'bezier-easing@3.2.0'
  # next 16.3.6 is the GHSA-vcvr-r3jv-pc5j security fix; it pins its @next/* companions to the
  # exact same version, and they were all published in the same batch, so they need the same pass.
  - 'next@16.3.6'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - react
  - react-dom
  - scheduler
  - lucide-react@1.35.0
  - '@radix-ui/primitive@1.2.0'
  - '@radix-ui/react-collection@1.2.0'
  - '@radix-ui/react-context@1.3.0'
  - '@radix-ui/react-direction@1.2.0'
  - '@radix-ui/react-label@2.1.17'
  - '@radix-ui/react-primitive@2.2.0'
  - '@radix-ui/react-roving-focus@1.2.0'
  - '@radix-ui/react-separator@1.2.0'
  - '@radix-ui/react-slot@1.5.0'
  - '@radix-ui/react-tabs@1.2.0'
  - '@radix-ui/react-use-callback-ref@1.1.5'
  - '@radix-ui/react-use-controllable-state@1.3.0'

# nextra-theme-docs 4.6.1 Layout breaks on zod 4.4.x (children stripped before safeParse).
# Remove when a release includes shuding/nextra#4990 (not published yet; latest is 4.6.1).
overrides:
  'nextra-theme-docs>zod': 4.6.6

# @vitest/mocker 5.0.3 still declares msw ^2.4.9, and only touches msw in Vitest Browser Mode,
# which this repo does not use. Remove when a release includes vitest-dev/vitest#11482
# (peer widened to ^2.4.9 || ^3.0.0; not published yet, latest is 5.0.3).
peerDependencyRules:
  allowedVersions:
    '@vitest/mocker>msw': '3'
