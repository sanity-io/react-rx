packages:
  - 'packages/*'
  - 'website'

allowBuilds:
  es5-ext: false
  esbuild: false
  sharp: true

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@sanity/*'
  - 'use-effect-event'

# nextra 4.6.1 is incompatible with zod 4.4.x (Layout children validation).
# Remove when a release includes shuding/nextra#4990 (not published yet; latest is 4.6.1).
overrides:
  'nextra>zod': 4.3.6
  'nextra-theme-docs>zod': 4.3.6
  # `@sanity/tsdown-config` pulls in the vanilla-extract plugin (unused here, react-rx ships no CSS),
  # and its `@vanilla-extract/css@^1.21.2` requirement can't be satisfied under `minimumReleaseAge`
  # yet. Remove once 1.21.2 is old enough to resolve on its own.
  '@vanilla-extract/css': 1.21.1
