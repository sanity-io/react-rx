packages:
  - 'packages/*'
  - 'website'
  - 'async-react'

catalog:
  rxjs: ^7.8.2

allowBuilds:
  es5-ext: false
  esbuild: false
  msw: false
  sharp: true

minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@sanity/*'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - '@vitejs/plugin-react@6.1.0 || 6.1.1'
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  # next 16.3.6 is the GHSA-vcvr-r3jv-pc5j security fix; it pins its @next/* companions to the
  # exact same version, and they were all published in the same batch, so they need the same pass.
  - 'next@16.3.6'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - react
  - react-dom
  - scheduler
  - lucide-react@1.35.0

# nextra-theme-docs 4.6.1 Layout breaks on zod 4.4.x (children stripped before safeParse).
# Remove when a release includes shuding/nextra#4990 (not published yet; latest is 4.6.1).
overrides:
  'nextra-theme-docs>zod': 4.3.6
